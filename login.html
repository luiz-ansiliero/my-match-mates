<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Match Mates - Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="background min-vh-100 d-flex flex-column justify-content-between">
    <!-- #region [rgba(46, 204, 113, 0.15)] Tela de Login -->
    <main class="z-content flex-grow-1 d-flex align-items-center justify-content-center p-3 p-md-4">
      <section
        id="page-login"
        class="login-card card border-0 rounded-4 shadow-lg p-4 p-md-5 d-flex flex-column align-items-center"
      >
        <figure class="logo-badge rounded-5 d-flex align-items-center justify-content-center mb-2">
          <img
            src="img/logo.png"
            alt="My Match Mates Logo"
            onerror="
              this.style.display = 'none';
              this.nextElementSibling.classList.remove('d-none');
            "
          />
          <figcaption
            class="d-none w-100 h-100 d-flex align-items-center justify-content-center fw-bold fs-3 text-danger"
          >
            M<span class="text-white">M</span>
          </figcaption>
        </figure>

        <form
          class="login-form-container d-flex flex-column align-items-center w-100"
          action="#"
          method="POST"
          onsubmit="event.preventDefault()"
        >
          <fieldset class="w-100 border-0 p-0 m-0">
            <label for="usuario" class="visually-hidden">Usuário</label>
            <input
              type="text"
              class="form-control rounded-3 py-2 px-3 border-0 text-white mb-3"
              id="usuario"
              name="usuario"
              placeholder="usuário"
              autocomplete="username"
              required
            />

            <label for="senha" class="visually-hidden">Senha</label>
            <input
              type="password"
              class="form-control rounded-3 py-2 px-3 border-0 text-white mb-4"
              id="senha"
              name="senha"
              placeholder="senha"
              autocomplete="current-password"
              required
            />
          </fieldset>

          <nav class="d-flex flex-column align-items-center justify-content-center gap-1 w-100">
            <a
              href="index.html"
              class="btn btn-danger btn-red fw-bold text-uppercase rounded-3 shadow"
              role="button"
            >
              Entrar
            </a>

            <p
              class="divider-or d-flex align-items-center justify-content-center gap-2 w-100"
              aria-hidden="true"
            >
              <span class="divider-line"></span>
              <span class="divider-text text-uppercase fw-bold small text-light">ou</span>
              <span class="divider-line"></span>
            </p>

            <a
              href="cadastro.html"
              class="btn btn-secondary btn-cadastrar fw-bold text-uppercase rounded-3"
              role="button"
            >
              Cadastrar
            </a>
          </nav>
        </form>
      </section>
    </main>
    <!-- #endregion -->

    <!-- #region [rgba(74, 144, 226, 0.15)] Geral e Compartilhado -->
    <footer class="login-footer border-top border-secondary border-opacity-10">
      <div
        class="container-fluid d-flex flex-column flex-md-row align-items-center justify-content-between gap-2"
      >
        <div class="d-flex align-items-center gap-2">
          <h2 class="footer-title fw-bold text-uppercase fs-5 text-light">MY MATCH MATES</h2>
          <span class="footer-sub small text-muted-custom">• Valorant Duo finder</span>
        </div>
        <p class="footer-copy small text-muted-custom">
          © 2026 MY MATCH MATES. Não afiliado à Riot Games Inc. Todos os direitos reservados.
        </p>
      </div>
    </footer>
    <!-- #endregion -->

    <script src="node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
